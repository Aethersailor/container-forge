name: Build wireproxy images

on:
  push:
    branches: [main]
    paths:
      - 'wireproxy/**'
      - '!wireproxy/**/*.md'
      - '!wireproxy/**/README*'
      - '!wireproxy/docs/**'
      - '.github/workflows/wireproxy.yml'
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wireproxy-publish-latest
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/aethersailor/wireproxy
  DOCKERHUB_IMAGE: docker.io/aethersailor/wireproxy

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve upstream master
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          revision="$(gh api repos/windtf/wireproxy/commits/master --jq .sha)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish latest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./wireproxy
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:latest
          build-args: |
            UPSTREAM_REVISION=${{ steps.upstream.outputs.revision }}
            PACKAGING_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=wireproxy
            org.opencontainers.image.description=Wireproxy master with capacity and Landlock patches
            org.opencontainers.image.source=https://github.com/Aethersailor/container-forge
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=master-${{ steps.upstream.outputs.revision }}
            org.opencontainers.image.licenses=ISC
            io.container-forge.upstream.source=https://github.com/windtf/wireproxy
            io.container-forge.upstream.revision=${{ steps.upstream.outputs.revision }}
      - name: Verify published digests
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          UPSTREAM_REVISION: ${{ steps.upstream.outputs.revision }}
        run: |
          set -euo pipefail
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            manifest="$(docker buildx imagetools inspect "${image}:latest" --format '{{json .Manifest}}')"
            digest="$(jq -er '.digest' <<< "$manifest")"
            if [[ "$digest" != "$EXPECTED_DIGEST" ]]; then
              printf 'Digest mismatch for %s: expected %s, got %s\n' \
                "${image}:latest" "$EXPECTED_DIGEST" "$digest" >&2
              exit 1
            fi
            printf '%s digest verified: %s\n' "${image}:latest" "$digest"
          done
          {
            echo '### wireproxy latest'
            echo "Upstream master: \`$UPSTREAM_REVISION\`"
            echo "Packaging commit: \`$GITHUB_SHA\`"
            echo "Platforms: linux/amd64, linux/arm64"
            echo "Digest: \`$EXPECTED_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
