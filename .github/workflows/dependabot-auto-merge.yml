name: Dependabot auto-merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
    paths: ['.github/workflows/dependabot-auto-merge.yml']
  schedule:
    - cron: '42 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Merge Dependabot updates
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: main
        shell: bash
        run: |
          set -euo pipefail
          pull_numbers=$(gh api --paginate --method GET "repos/$REPOSITORY/pulls" \
            -f state=open -f base="$BASE_BRANCH" -F per_page=100 \
            --jq '.[] | select(.user.login == "dependabot[bot]") | .number')
          merged=0
          result=0
          while IFS= read -r number; do
            test -n "$number" || continue
            pull=$(gh api "repos/$REPOSITORY/pulls/$number")
            head_sha=$(jq -r '.head.sha' <<<"$pull")
            title=$(jq -r '.title' <<<"$pull")
            response=''
            for attempt in 1 2 3; do
              if response=$(gh api --method PUT "repos/$REPOSITORY/pulls/$number/merge" \
                -f merge_method=squash -f sha="$head_sha" \
                -f commit_title="$title (#$number)" 2>&1); then
                break
              fi
              sleep 2
            done
            if jq -e '.merged == true' <<<"$response" >/dev/null 2>&1; then
              echo "Merged Dependabot PR #$number: $(jq -r '.sha' <<<"$response")"
              merged=$((merged + 1))
            else
              echo "::warning::GitHub could not merge Dependabot PR #$number: $response"
              result=1
            fi
          done <<< "$pull_numbers"

          echo "Merged $merged Dependabot PR(s) with the repository Actions token"
          exit "$result"
